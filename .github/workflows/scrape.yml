name: Update offers

on:
  schedule:
    # Wednesday 3:17 PM Saudi time (12:17 UTC): flyers drop Wednesday morning
    - cron: "17 12 * * 3"
    # Sunday 9:17 AM Saudi time (06:17 UTC)
    - cron: "17 6 * * 0"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
